server.port=8080
server.address=${BIND_ADDRESS:127.0.0.1}
spring.application.name=api-gateway
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
spring.jackson.deserialization.fail-on-unknown-properties=true
trip.identity-url=${IDENTITY_URL:http://127.0.0.1:8081}
trip.expense-url=${EXPENSE_URL:http://127.0.0.1:8082}
trip.policy-url=${POLICY_URL:http://127.0.0.1:8083}
trip.ai-url=${AI_URL:http://127.0.0.1:8090}
trip.service-key=${SERVICE_KEY}
trip.service-name=api-gateway
spring.servlet.multipart.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
