# OPTIONAL infrastructure only. No Java, Python or React containers.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${DB_USER:-tripledger}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/configure.py first}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${DOCKER_POSTGRES_PORT:-5433}:5432"
    volumes:
      - tripledger_pg17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U "$$POSTGRES_USER" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-tripledger}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?Run scripts/configure.py first}
    ports:
      - "127.0.0.1:${RABBIT_PORT:-5672}:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - tripledger_rabbit:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  tripledger_pg17:
  tripledger_rabbit:
