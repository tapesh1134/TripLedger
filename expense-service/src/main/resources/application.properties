server.port=8082
server.address=${BIND_ADDRESS:127.0.0.1}
spring.application.name=expense-service
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
spring.jackson.deserialization.fail-on-unknown-properties=true
trip.identity-url=${IDENTITY_URL:http://127.0.0.1:8081}
trip.expense-url=${EXPENSE_URL:http://127.0.0.1:8082}
trip.policy-url=${POLICY_URL:http://127.0.0.1:8083}
trip.ai-url=${AI_URL:http://127.0.0.1:8090}
trip.service-key=${SERVICE_KEY}
trip.service-name=expense-service
spring.datasource.url=${EXPENSE_JDBC_URL:jdbc:postgresql://127.0.0.1:5433/tripledger_expense}
spring.datasource.username=${DB_USER:tripledger}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.flyway.enabled=true
spring.rabbitmq.host=${RABBIT_HOST:127.0.0.1}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:tripledger}
spring.rabbitmq.password=${RABBIT_PASSWORD}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
trip.receipt-root=${RECEIPT_ROOT:./runtime/receipts}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
