[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tripledger"
version = "0.9.0"
description = "TripLedger: PostgreSQL expense review with pgvector policy retrieval"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "httpx[socks]>=0.27,<1", "python-dotenv>=1,<2", "mcp>=1.30,<2", "jsonschema>=4.20,<5", "Pillow>=11,<13", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-jsonschema"]

[project.scripts]
tripledger = "app.dashboard:main"
tripledger-review = "app.review:main"
tripledger-db = "app.database:main"
tripledger-evaluate = "app.evaluate:main"

[tool.setuptools.packages.find]
include = ["app*", "integrations*", "mcp_server*", "agent*", "mock_systems*", "evals*", "storage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["storage", "app", "integrations", "mcp_server", "agent", "evals/scoring.py", "evals/run_eval.py"]

# MCP v1 low-level registration decorators lack complete typing annotations.
# Restrict this exception to decorator boundaries, not the tool implementation.
[[tool.mypy.overrides]]
module = "mcp_server.server"
disable_error_code = ["untyped-decorator", "no-untyped-call"]

[tool.setuptools.package-data]
app = ["static/*.html", "static/*.css", "static/*.js"]
storage = ["schema.sql"]
