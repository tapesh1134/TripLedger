[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tripledger-day1"
version = "0.1.0"
description = "TripLedger Day 1: schemas, custom API clients and exact arithmetic"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "httpx>=0.27,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[project.scripts]
tripledger = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "integrations*", "mcp_server*", "agent*", "mock_systems*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "integrations", "mcp_server"]
